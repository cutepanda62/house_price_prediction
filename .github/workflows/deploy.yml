
name: Deploy Pipeline

on:
  push:
    branches: [main]

  workflow_dispatch:

jobs:

  # ============================================================
  # BUILD AND PUSH DOCKER IMAGE
  # ============================================================

  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout GitHub repository
      - name: Checkout Code
        uses: actions/checkout@v4


      # 3. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}


      # 4. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/house-price-predictor:latest .


      # 5. Push Docker image to Docker Hub
      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/house-price-predictor:latest


  # ============================================================
  # DEPLOY TO EC2
  # ============================================================

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:

      # 6. SSH into EC2
      - name: SSH into EC2 and redeploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            echo "======================================"
            echo "Starting deployment..."
            echo "======================================"

            # -----------------------------------------------
            # Pull latest image
            # -----------------------------------------------

            docker pull \
              ${{ secrets.DOCKERHUB_USERNAME }}/house-price-predictor:latest


            # -----------------------------------------------
            # Stop existing container
            # -----------------------------------------------

            docker stop house-price-predictor || true


            # -----------------------------------------------
            # Remove existing container
            # -----------------------------------------------

            docker rm  house-price-predictor || true


            # -----------------------------------------------
            # Run new container
            # -----------------------------------------------

            docker run -d \
              --name house-price-predictor \
              -p 8000:8000 \
              --add-host=host.docker.internal:host-gateway \
              -e MLFLOW_TRACKING=http://host.docker.internal:5001 \
              ${{ secrets.DOCKERHUB_USERNAME }}/house-price-predictor:latest


            # -----------------------------------------------
            # Wait for application
            # -----------------------------------------------

            sleep 5


            # -----------------------------------------------
            # Show container
            # -----------------------------------------------

            docker ps


            # -----------------------------------------------
            # Show application logs
            # -----------------------------------------------

            docker logs --tail 50 house-price-predictor


            # -----------------------------------------------
            # Health check
            # -----------------------------------------------

            curl -f http://localhost:8000/health


            # -----------------------------------------------
            # Deployment successful
            # -----------------------------------------------

            echo "======================================"
            echo "Deployment successful!"
            echo "Application: http://${{ secrets.EC2_HOST }}:8000"
            echo "======================================"
